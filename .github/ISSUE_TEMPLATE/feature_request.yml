name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: A sketch of the parameters, or the keyfile you would like to get.
